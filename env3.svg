<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <title>the envelope open, the letter slid out</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb886"/>
      <stop offset="1" stop-color="#5f8a5a"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4c6"/>
      <stop offset="1" stop-color="#8fb886"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="300" rx="120" ry="14" fill="#33422e" opacity=".18" filter="url(#soft)"/>

  <!-- back flap, folded open behind the letter -->
  <polygon points="160,15 70,90 250,90" fill="url(#flap)" stroke="#33422e" stroke-width="4" stroke-linejoin="round"/>
  <!-- side flaps, folded outward behind the letter -->
  <polygon points="15,190 70,90 70,290" fill="url(#body)" stroke="#33422e" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="305,190 250,90 250,290" fill="url(#body)" stroke="#33422e" stroke-width="4" stroke-linejoin="round"/>

  <!-- the letter itself -->
  <rect x="70" y="90" width="180" height="200" rx="14" fill="url(#paper)" stroke="#33422e" stroke-width="4"/>
  <!-- a small botanical sprig up top, well clear of the button below -->
  <g stroke="#c99a3e" stroke-width="2" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M160 106 C160 118 160 118 160 126"/>
    <path d="M160 112 C152 108 148 100 150 94"/>
    <path d="M160 112 C168 108 172 100 170 94"/>
  </g>

  <!-- front pocket flap, folded down over the lower letter -->
  <polygon points="160,235 70,290 250,290" fill="url(#flap)" stroke="#33422e" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#e6b657" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M84 272 C94 278 96 286 90 294"/>
    <path d="M236 272 C226 278 224 286 230 294"/>
  </g>

  <g fill="#e6b657" opacity=".85">
    <circle cx="36" cy="130" r="2.6"/>
    <circle cx="286" cy="150" r="2.4"/>
    <circle cx="44" cy="240" r="2.2"/>
  </g>
</svg>
