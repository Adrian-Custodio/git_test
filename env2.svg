<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <title>the envelope's ribbon coming loose, seal cracking</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb886"/>
      <stop offset="1" stop-color="#5f8a5a"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4c6"/>
      <stop offset="1" stop-color="#8fb886"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2a4b4"/>
      <stop offset="1" stop-color="#c76f82"/>
    </linearGradient>
    <radialGradient id="seal" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f7d896"/>
      <stop offset="55%" stop-color="#e6b657"/>
      <stop offset="1" stop-color="#c1893a"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="272" rx="118" ry="14" fill="#33422e" opacity=".18" filter="url(#soft)"/>

  <rect x="42" y="72" width="236" height="168" rx="16" fill="url(#body)" stroke="#33422e" stroke-width="4"/>
  <polygon points="42,72 278,72 160,178" fill="url(#flap)" stroke="#33422e" stroke-width="4" stroke-linejoin="round"/>

  <g stroke="#e6b657" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M56 86 C70 84 78 92 76 104"/>
    <circle cx="76" cy="104" r="3" fill="#e6b657" stroke="none"/>
    <path d="M264 86 C250 84 242 92 244 104"/>
    <circle cx="244" cy="104" r="3" fill="#e6b657" stroke="none"/>
    <path d="M70 220 C84 224 88 234 80 244"/>
    <path d="M250 220 C236 224 232 234 240 244"/>
  </g>

  <!-- a sliver of the letter already peeking out from under the loosened flap -->
  <rect x="132" y="172" width="56" height="26" rx="4" fill="#fffaf0" stroke="#33422e" stroke-width="2"/>

  <!-- ribbon ends, untied and swinging loose to either side -->
  <g transform="translate(118,150) rotate(-22)">
    <path d="M0,0 L22,0 L22,58 L11,72 L0,58 Z" fill="url(#ribbon)" stroke="#33422e" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(180,150) rotate(22)">
    <path d="M0,0 L22,0 L22,58 L11,72 L0,58 Z" fill="url(#ribbon)" stroke="#33422e" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- the wax seal, cracked and slipping off -->
  <g transform="translate(160,196) rotate(-16)">
    <circle cx="0" cy="0" r="29" fill="url(#seal)" stroke="#33422e" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#c1893a" stroke-width="1.5" opacity=".6"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#33422e">&#10084;</text>
    <path d="M-15 -19 L5 8" stroke="#5f4420" stroke-width="1.6" opacity=".55"/>
  </g>

  <g fill="#e6b657" opacity=".85">
    <circle cx="90" cy="56" r="2.4"/>
    <circle cx="238" cy="120" r="2.6"/>
    <circle cx="252" cy="58" r="2"/>
  </g>
</svg>
