       - the rounded, friendly Quicksand font instead of the pixel font
       - a gentle lift on hover and a soft press on tap
     ===================================================================== */
  :root{
    --btn-sage-1:#7dbb92; --btn-sage-2:#4f8f66;     /* natural leaf green */
    --btn-rose-1:#eba2b8; --btn-rose-2:#c9668a;     /* dusty rose */
    --btn-shadow-sage: 0 6px 16px rgba(63,120,86,.28), 0 1px 3px rgba(63,120,86,.25);
    --btn-shadow-rose: 0 6px 16px rgba(190,90,125,.28), 0 1px 3px rgba(190,90,125,.25);
  }
  .btn-primary, .choice-btn, .btn-yes, .loading-start-btn{
    font-family:'Quicksand', sans-serif; font-weight:700;
    letter-spacing:.02em;
    color:#fff;
    border: 1px solid rgba(255,255,255,.55);
    border-radius:999px;
    text-shadow: 0 1px 1px rgba(0,0,0,.12);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary, .choice-btn{
    background: linear-gradient(180deg, var(--btn-sage-1), var(--btn-sage-2));
    box-shadow: var(--btn-shadow-sage), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-primary{ padding: .85rem 2rem; font-size: 1rem; }
  .choice-btn:nth-child(2), .btn-yes, .loading-start-btn{
    background: linear-gradient(180deg, var(--btn-rose-1), var(--btn-rose-2));
    box-shadow: var(--btn-shadow-rose), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-primary:hover, .choice-btn:hover, .btn-yes:hover, .loading-start-btn.show:hover{
    transform: translateY(-2px);
    filter: brightness(1.04);
  }
  .btn-primary:hover, .choice-btn:hover{ box-shadow: 0 10px 22px rgba(63,120,86,.32), inset 0 1px 0 rgba(255,255,255,.35); }
  .choice-btn:nth-child(2):hover, .btn-yes:hover, .loading-start-btn.show:hover{ box-shadow: 0 10px 22px rgba(190,90,125,.32), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn-primary:active, .choice-btn:active, .btn-yes:active, .loading-start-btn.show:active{
    transform: translateY(1px) scale(.97);
    filter: brightness(.97);
    box-shadow: 0 2px 6px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-primary:focus-visible, .choice-btn:focus-visible, .btn-yes:focus-visible,
  .loading-start-btn:focus-visible, .choice-picture-btn:focus-visible, .sound-toggle:focus-visible{
    outline: 3px solid rgba(240,139,171,.55); outline-offset: 3px;
  }

  /* picture choice cards: soft white card, no dark outline */
  .choice-picture-btn{
    background:#fff;
    border: 1px solid rgba(201,140,160,.35);
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(120,60,80,.14), 0 1px 3px rgba(120,60,80,.1);
  }
  .choice-picture-btn:hover{ transform: translateY(-3px); box-shadow: 0 12px 26px rgba(120,60,80,.18); }
  .choice-picture-btn:active{ transform: scale(.97); box-shadow: 0 3px 8px rgba(120,60,80,.15); }
  .choice-img-box{ border: none; border-radius: 12px; }
  .choice-picture-btn .choice-label{ font-family:'Quicksand', sans-serif; color:#5b4049; font-size:.95rem; }

  /* sound button: a frosted little circle */
  .sound-toggle{
    background: rgba(255,255,255,.8);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(201,140,160,.4);
    box-shadow: 0 4px 12px rgba(120,60,80,.15);
    width:44px; height:44px; font-size:1.1rem;
  }
  .sound-toggle:active{ transform: scale(.94); box-shadow: 0 2px 6px rgba(120,60,80,.15); }

  /* "keep scrolling": a small frosted arrow in the corner instead of a big
     chip in the middle of the letter text */
  .scroll-hint{
    left:auto; right: calc(14px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom));
    transform:none;
    width:40px; height:40px; padding:0; justify-content:center;
    font-size:0; color:#7a3a55;
    background: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(201,140,160,.4);
    box-shadow: 0 4px 12px rgba(120,60,80,.18);
    animation: bounceHintCorner 1.4s ease-in-out infinite;
  }
  .scroll-hint::after{ content:"⌄"; font-size:1.4rem; line-height:1; margin-top:-6px; font-family:'Quicksand', sans-serif; font-weight:700; }
  .scroll-hint > *{ display:none; }
  @keyframes bounceHintCorner{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(4px); } }

  /* ---------- nothing hides under the sound button ----------
     Headings at the top of each screen get enough room to clear the fixed
     sound button in the top-right corner. */
  .screen{ padding-top: calc(4.4rem + env(safe-area-inset-top)); }
  .pause-heading, .quiz-progress{ padding: 0 2.6rem; }
  /* buttons never sit on top of each other or squeeze text */
  .choices{ row-gap: .9rem; }
  .final-continue{ margin-top: 1.2rem; }
  #screen-final{ padding-top: calc(4.2rem + env(safe-area-inset-top)); }
  .btn-primary.envelope-next-btn{ padding: .6rem 1.4rem; font-size: .9rem; }   /* stays compact on the little letter */
  .final-continue, #screen-final .screen-content{ padding-bottom: .5rem; }
</style>

<body>

<!-- Rose drawings for the rose shower: a front view (open bloom), a back
     view (red petals with the green sepal star in the middle) and a loose
     petal. Reused by every falling rose via <use href="#rose-...">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="rsPetal" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#ff4a5c"/><stop offset=".55" stop-color="#d4142e"/><stop offset="1" stop-color="#7c0616"/>
    </radialGradient>
    <radialGradient id="rsInner" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#e8283f"/><stop offset="1" stop-color="#8a0a1c"/>
    </radialGradient>
    <linearGradient id="rsSepal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9a3c"/><stop offset="1" stop-color="#1f5a24"/>
    </linearGradient>
    <linearGradient id="tlPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9fbd"/><stop offset="1" stop-color="#e5638e"/>
    </linearGradient>
    <radialGradient id="fmnBlue" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#cfe0ff"/><stop offset="1" stop-color="#7f9ff0"/>
    </radialGradient>
    <!-- sunflower: long pointed petal; daisy: slim rounded petal -->
    <path id="sfPetal" d="M50 50 C44 40 44 18 50 4 C56 18 56 40 50 50Z"/>
    <path id="dsPetal" d="M50 50 C46 40 45 16 50 8 C55 16 54 40 50 50Z"/>
    <!-- one forget-me-not bloom: 5 round petals, yellow-white eye -->
    <g id="fmnBloom">
      <g fill="url(#fmnBlue)" stroke="#5b7bd0" stroke-width="1.6">
        <circle cx="50" cy="30" r="15"/><circle cx="69" cy="44" r="15"/><circle cx="62" cy="67" r="15"/><circle cx="38" cy="67" r="15"/><circle cx="31" cy="44" r="15"/>
      </g>
      <circle cx="50" cy="51" r="9" fill="#fff6d6"/><circle cx="50" cy="51" r="4.5" fill="#ffc93c"/>
    </g>
    <!-- one rounded petal shape, pointing up from the center (50,50) -->
    <path id="rsPetalShape" d="M50 54 C24 50 14 22 32 8 C42 1 58 1 68 8 C86 22 76 50 50 54Z"/>
  </defs>

  <symbol id="rose-front" viewBox="0 0 100 100">
    <!-- full, ruffled bloom: 4 rings of wide overlapping petals, darker toward the middle -->

<!-- =====================================================================
     PASSWORD GATE + FLORAL INTRO (this part is NOT encrypted)
     Everything after SECRET-START is encrypted by lock_site.py with
     AES-256-GCM. The key comes from the password via PBKDF2-SHA256
     (310,000 rounds, random salt), so:
       - the page holds no password and no hash to compare against;
       - a wrong password simply fails to decrypt (GCM's built-in check);
       - nothing is revealed by skipping or editing this script, because
         without the right password the content is unreadable.
     The typed password is never put into the page (no innerHTML), so it
     can't be used to inject anything.
     ===================================================================== -->
<script>
(function(){
  'use strict';
  var intro = document.getElementById('floralIntro');
  var cover = document.getElementById('fiCover');
  var ring = document.getElementById('fiRing');
  var spin = document.getElementById('fiRingSpin');
  var form = document.getElementById('fiGate');
  var input = document.getElementById('fiPass');
  var eye = document.getElementById('fiEye');
  var btn = document.getElementById('fiGo');
  var msg = document.getElementById('fiMsg');
  document.documentElement.classList.add('intro-lock');

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var WIPE = 1500;

  // ring of flowers that rides the edge of the opening circle
  var colors = ['#f08bab', '#5bb877', '#ffc2d4', '#d9628a', '#9bd8a8', '#f7a6bf'];
  var COUNT = 16, html = '';
  for (var i = 0; i < COUNT; i++){
    var ang = (i / COUNT) * Math.PI * 2;
    var isLeaf = i % 4 === 3;
    html += '<span class="fi-ring-flower" style="left:' + (50 + 50 * Math.cos(ang)) + '%;top:' + (50 + 50 * Math.sin(ang)) + '%;color:' + colors[i % colors.length] + '">' +
            '<svg viewBox="0 0 100 100"><use href="#' + (isLeaf ? 'fl-leaf' : 'fl-bloom') + '" width="100" height="100"/></svg></span>';
  }
  spin.innerHTML = html;   // fixed markup only, nothing from the user

  function setHole(r){
    var m = 'radial-gradient(circle at 50% 50%, transparent ' + r + 'px, #000 ' + (r + 1.5) + 'px)';
    cover.style.webkitMaskImage = m; cover.style.maskImage = m;
  }
  function finish(){
    intro.classList.add('done');
    document.documentElement.classList.remove('intro-lock');
    setTimeout(function(){ intro.remove(); }, reduceMotion ? 550 : 50);
  }
  var wiping = false;
  function startWipe(){
    if (wiping) return; wiping = true;
    if (reduceMotion){ finish(); return; }
    intro.classList.add('wiping');
    var maxR = Math.hypot(window.innerWidth, window.innerHeight) / 2 + 70;
    var ease = function(t){ return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
    var t0 = null;
    function frame(now){
      if (t0 === null) t0 = now;
      var p = Math.min(1, (now - t0) / WIPE), e = ease(p), r = e * maxR;
      setHole(r);
      ring.style.width = ring.style.height = (r * 2) + 'px';
      ring.style.setProperty('--grow', e.toFixed(3));
      ring.style.opacity = p < .1 ? p / .1 : (p > .82 ? Math.max(0, (1 - p) / .18) : 1);
      if (p < 1) requestAnimationFrame(frame); else finish();
    }
    requestAnimationFrame(frame);
  }

  // show / hide password
  eye.addEventListener('click', function(){
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    input.focus();
  });

  function say(text){ msg.textContent = text; }        // textContent only, never HTML
  function shake(){ form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); }

  // --- the encrypted content ---
  // read lazily: the encrypted block sits further down the page than this script
  var sealedEl = null, sealed = null;
  function loadSealed(){
    if (sealedEl) return;
    sealedEl = document.getElementById('sealed');
    if (sealedEl){ try { sealed = JSON.parse(sealedEl.textContent); } catch (e) { sealed = null; } }
  }

  function b64(str){
    var bin = atob(str), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // exactly the same normalisation lock_site.py uses (trim + Unicode NFC)
  function normalise(pw){ return pw.trim().normalize('NFC'); }

  function unlock(pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(normalise(pw)), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', hash:'SHA-256', salt: b64(sealed.salt), iterations: sealed.iter },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      })
      .then(function(key){
        // fails (throws) for a wrong password or any tampering with the file
        return crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(sealed.iv) }, key, b64(sealed.ct));
      })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }

  function reveal(htmlText){
    // authenticated content we encrypted ourselves -> safe to insert; its scripts run on insert
    var frag = document.createRange().createContextualFragment(htmlText);
    sealedEl.parentNode.insertBefore(frag, sealedEl);
    sealedEl.remove();
    setTimeout(startWipe, 250);
  }

  // slow down repeated guessing: after 5 misses, wait (30s, then 60s, 120s...)
  var misses = 0, lockedUntil = 0, busy = false;
  function lockCountdown(){
    var left = Math.ceil((lockedUntil - Date.now()) / 1000);
    if (left > 0){ say('Too many tries. Try again in ' + left + 's.'); btn.disabled = true; setTimeout(lockCountdown, 500); }
    else { btn.disabled = false; say(''); }
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (busy || Date.now() < lockedUntil) return;
    var pw = input.value;
    if (!pw.trim()){ say('Type the password first.'); shake(); return; }

    loadSealed();
    // dev copy (index.src.html, not encrypted): any password opens it
    if (!sealedEl){ startWipe(); return; }
    if (!sealed){ say('This page looks damaged. Please reload.'); return; }
    if (!window.crypto || !crypto.subtle){ say('Please open this link in Chrome or Safari.'); return; }

    busy = true; btn.disabled = true; say('Checking...');
    unlock(pw).then(function(htmlText){
      input.value = ''; pw = null;
      say('');
      reveal(htmlText);
    }).catch(function(){
